name: Build Basemental Rhodes

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  VERSION: 1.0.0

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Ad-hoc sign
        run: |
          ART="build/BasementalRhodes_artefacts/Release"
          codesign --force --deep -s - "$ART/AU/Basemental Rhodes.component"
          codesign --force --deep -s - "$ART/VST3/Basemental Rhodes.vst3"
          codesign --force --deep -s - "$ART/Standalone/Basemental Rhodes.app"

      - name: Validate Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/BasementalRhodes_artefacts/Release/AU/Basemental Rhodes.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aumu BRho Bsml

      - name: Build installer (.pkg)
        run: packaging/build_mac_installer.sh build/BasementalRhodes_artefacts/Release "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: Basemental-Rhodes-macOS
          path: dist/*.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $art = "build/BasementalRhodes_artefacts/Release"
          Compress-Archive -Path "$art/VST3/Basemental Rhodes.vst3", "$art/Standalone/Basemental Rhodes.exe" -DestinationPath "dist/Basemental-Rhodes-$env:VERSION-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Basemental-Rhodes-Windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
